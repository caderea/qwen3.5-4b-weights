name: Publish Kev-8B model weights

on:
  workflow_dispatch:
    inputs:
      component:
        description: Which Kev-8B component to publish
        type: choice
        options:
          - base
          - adapter
        required: true
      revision:
        description: Upstream revision (base defaults to Kev's pinned commit)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: kev-8b-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Configure source and release tag
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if [[ "$COMPONENT" == "base" ]]; then
            echo 'MODEL_REPO=Qwen/Qwen3-8B-Base' >> "$GITHUB_ENV"
            echo 'RELEASE_TAG=kev-8b-base-v1' >> "$GITHUB_ENV"
            echo "MODEL_REVISION=${REVISION:-49e3418f}" >> "$GITHUB_ENV"
          elif [[ "$COMPONENT" == "adapter" ]]; then
            echo 'MODEL_REPO=jaredpalmer/kev-8b' >> "$GITHUB_ENV"
            echo 'RELEASE_TAG=kev-8b-adapter-v1' >> "$GITHUB_ENV"
            echo "MODEL_REVISION=${REVISION:-main}" >> "$GITHUB_ENV"
          else
            exit 1
          fi

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.30,<2' 'requests>=2.32,<3'

      - name: Run packaging tests
        run: python -m unittest discover -s tests -v

      - name: Create draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Refusing to overwrite." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --draft \
            --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --title "$MODEL_REPO (Kev-8B mirror)" \
            --notes "Unmodified upstream weights: https://huggingface.co/$MODEL_REPO. See manifest for pinned revision and SHA256 hashes."

      - name: Stream and upload every chunk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/stream_release.py \
            --repo "$MODEL_REPO" \
            --revision "$MODEL_REVISION" \
            --out dist --chunk-mib 1024 --release-tag "$RELEASE_TAG"

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
